<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 glass-card">
      <h2 class="text-center mb-4">CareerCompass AI Login</h2>
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="mb-3">
          <input type="email" class="form-control glass-input" placeholder="Email Address" formControlName="email">
        </div>
        <div class="mb-3">
          <input type="password" class="form-control glass-input" placeholder="Password" formControlName="password">
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
          Sign In
        </button>
      </form>
      <div class="mt-3 text-center">
        <small>Don't have an account? <a routerLink="/register" class="text-white">Register here</a></small>
      </div>
    </div>
  </div>
</div>
